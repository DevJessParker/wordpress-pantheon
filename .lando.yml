name: wordpress-pantheon
recipe: pantheon
config:
  framework: wordpress
  site: YOUR_PANTHEON_SITE_NAME
  id: YOUR_PANTHEON_SITE_ID

services:
  appserver:
    build_as_root:
      # PERFORMANCE OPTIMIZATION: Only run apt-get update if packages are missing
      # This avoids 30-120 second delays on every rebuild
      - >
        if ! command -v vim >/dev/null 2>&1 || ! command -v wget >/dev/null 2>&1; then
          echo "Installing missing system packages...";
          apt-get update -y && apt-get install -y vim wget;
        else
          echo "System packages already installed, skipping apt-get update...";
        fi
      # PERFORMANCE OPTIMIZATION: Only download WP-CLI if not present
      # This avoids 5-10 second download on every rebuild
      - >
        if [ ! -f "/usr/local/bin/wp" ]; then
          echo "Installing WP-CLI...";
          curl -fsSL -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar;
          chmod +x /usr/local/bin/wp;
        else
          echo "WP-CLI already installed, skipping...";
        fi
    build:
      # Clean up any partial/failed Composer installations
      - >
        if [ -d "vendor" ] && [ ! -f "vendor/autoload.php" ]; then
          echo "Cleaning up partial Composer installation...";
          rm -rf vendor/;
        fi
      # PERFORMANCE OPTIMIZATION: Only install Composer dependencies if missing
      # Composer cache is preserved between rebuilds via Docker volumes
      - >
        if [ ! -d "vendor" ] || [ ! -f "vendor/autoload.php" ]; then
          echo "Installing Composer dependencies (this may take 2-3 minutes on first run)...";
          composer install --no-interaction --prefer-dist --optimize-autoloader;
        else
          echo "Composer dependencies already installed, skipping...";
        fi
    overrides:
      environment:
        # Enable WP_DEBUG for local development
        WP_DEBUG: 'true'
        WP_DEBUG_LOG: 'true'
        WP_DEBUG_DISPLAY: 'false'
        # PERFORMANCE: Enable Composer cache for faster dependency installation
        COMPOSER_CACHE_DIR: '/var/www/.composer/cache'
        # Pantheon authentication - loads from .env file
        # This prevents interactive token prompts during lando pull
        TERMINUS_MACHINE_TOKEN: '${TERMINUS_TOKEN}'

  database:
    type: mysql:8.0
    portforward: true
    creds:
      user: wordpress
      password: wordpress
      database: wordpress
    overrides:
      environment:
        MYSQL_ROOT_PASSWORD: root

  cache:
    type: redis:7
    portforward: true

  # PhpMyAdmin for easy database management (GUI)
  pma:
    type: phpmyadmin
    hosts:
      - database

tooling:
  # Database operations
  pull-db:
    service: appserver
    description: Pull database from Pantheon Dev environment
    cmd:
      - /app/scripts/pull-db.sh

  push-db:
    service: appserver
    description: Push database to Pantheon Dev environment (USE WITH CAUTION)
    cmd:
      - /app/scripts/push-db.sh

  sync-db:
    service: appserver
    description: Sync database from Pantheon Dev environment
    cmd:
      - terminus backup:create ${PANTHEON_SITE}.dev --element=db
      - /app/scripts/pull-db.sh

  # File operations
  pull-files:
    service: appserver
    description: Pull files from Pantheon Dev environment
    cmd:
      - /app/scripts/pull-files.sh

  # Redis cache operations
  clear-cache:
    service: appserver
    description: Clear all caches (WordPress + Redis)
    cmd:
      - wp cache flush
      - redis-cli -h cache FLUSHALL

  # Terminus commands
  terminus:
    service: appserver
    description: Run Terminus commands

  # WordPress CLI
  wp:
    service: appserver
    description: Run WP-CLI commands

  # Composer
  composer:
    service: appserver

  # Database backup
  backup-db:
    service: appserver
    description: Create local database backup
    cmd:
      - mkdir -p /app/backups
      - wp db export /app/backups/local-backup-$(date +%Y%m%d-%H%M%S).sql

  # Open PhpMyAdmin
  phpmyadmin:
    service: pma
    description: Open PhpMyAdmin in browser

  # Security scan
  security-check:
    service: appserver
    description: Run security checks on WordPress installation
    cmd:
      - /app/scripts/security-check.sh

proxy:
  pma:
    - pma.wordpress-pantheon.lndo.site

events:
  post-start:
    - appserver: echo "Lando is ready! Access your site at https://wordpress-pantheon.lndo.site"
    - appserver: echo "PhpMyAdmin available at https://pma.wordpress-pantheon.lndo.site"
    - appserver: echo ""
    - appserver: echo "Quick Commands:"
    - appserver: echo "  lando pull-db    - Pull database from Pantheon Dev"
    - appserver: echo "  lando pull-files - Pull files from Pantheon Dev"
    - appserver: echo "  lando wp         - Run WP-CLI commands"
    - appserver: echo "  lando terminus   - Run Terminus commands"

  post-db-import:
    - appserver: wp search-replace '$PANTHEON_SITE_URL' 'https://wordpress-pantheon.lndo.site' --skip-columns=guid --all-tables
